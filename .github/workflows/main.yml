name: Angular CI/CD Pipeline

on:
  pull_request:
    branches:
      - develop # Esegui la pipeline per PR verso develop
      - main    # Esegui la pipeline per PR verso main
  push:
    branches:
      - develop # Esegui la pipeline per push su develop (per il deploy di sviluppo)
      - main    # Esegui la pipeline per push su main (per il deploy di produzione)

env:
  NODE_VERSION: '22' # Specifica la versione di Node.js che preferisci usare

jobs:
  build-test-lint:
    name: Build, Test and Lint
    runs-on: ubuntu-latest # Il sistema operativo su cui verrà eseguito il job

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4 # Azione per scaricare il tuo codice

      - name: Setup Node.js
        uses: actions/setup-node@v4 # Azione per configurare Node.js
        with:
          node-version: ${{ env.NODE_VERSION }} # Usa la versione definita nell'env

      - name: Installazione delle dipendenze
        run: npm ci # 'npm ci' è consigliato in CI per installazioni pulite e veloci

      - name: Esegui Linting
        run: npm run lint # Esegue lo script di linting definito in package.json

      - name: Esegui Test Unitari
        run: npm test -- --watch=false --browsers=ChromeHeadless # Esegue i test in modalità headless

      - name: Build del Progetto Angular
        # Compila l'applicazione Angular per la produzione per tutti i branch che arrivano qui
        run: npm run build -- --configuration=production

      # Carica gli artefatti di build per il deploy job
      - name: Carica artefatti di build
        uses: actions/upload-artifact@v4
        with:
          name: angular-build-artifacts # Nome dell'artefatto
          path: dist/personal-portfolio/browser
          # Il percorso deve corrispondere alla directory di output di ng build

  deploy-to-firebase:
    name: Deploy su Firebase Hosting
    needs: build-test-lint # Questo job dipende dal successo del job 'build-test-lint'
    runs-on: ubuntu-latest
    # Il deploy avviene solo se la branch è 'develop' o 'main' E il job precedente ha avuto successo
    if: success() && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main')

    steps:
      - name: Checkout del codice sorgente (per file Firebase config)
        uses: actions/checkout@v4 # Questo scarica l'intero repository, incluso firebase.json

      - name: Prepare Google Application Credentials
        shell: bash
        run: |
          echo "${{ secrets.GOOGLE_APPLICATION_CREDENTIALS }}" | base64 --decode > "google-application-credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$(pwd)/google-application-credentials.json" >> $GITHUB_ENV

      - name: Scarica artefatti di build
        uses: actions/download-artifact@v4
        with:
          name: angular-build-artifacts
          # Scarica gli artefatti nella struttura corretta per Firebase
          path: ./dist/personal-portfolio/browser

      - name: Debug - Verifica struttura directory
        run: |
          echo "Contenuto directory corrente:"
          ls -la
          echo "Contenuto dist:"
          ls -la dist/ || echo "dist non esiste"
          echo "Contenuto dist/personal-portfolio:"
          ls -la dist/personal-portfolio/ || echo "dist/personal-portfolio non esiste"
          echo "Contenuto dist/personal-portfolio/browser:"
          ls -la dist/personal-portfolio/browser/ || echo "dist/personal-portfolio/browser non esiste"

      - name: Installazione Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy su Firebase Hosting (Sviluppo o Produzione)
        run: firebase deploy --only hosting --project ${{ secrets.FIREBASE_PROJECT_ID }}

      - name: Remove credentials file
        if: success() || failure()
        run: rm google-application-credentials.json
